name: Element June APK

on:
  workflow_dispatch:
  push:
    branches: [ june ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

concurrency:
  group: june-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Element June APK
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Decode signing key
        env:
          JUNE_KEYSTORE_B64: ${{ secrets.JUNE_KEYSTORE_B64 }}
        run: echo "$JUNE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/june.p12"
      - name: Assemble F-Droid release APK (UnifiedPush)
        env:
          JUNE_KEYSTORE_FILE: ${{ runner.temp }}/june.p12
          JUNE_STORE_PASSWORD: ${{ secrets.JUNE_STORE_PASSWORD }}
          JUNE_KEY_ALIAS: ${{ secrets.JUNE_KEY_ALIAS }}
        run: ./gradlew :app:assembleFdroidRelease $CI_GRADLE_ARG_PROPERTIES
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/june.p12"
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: element-june-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 14
